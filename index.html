<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1d4ed8">
  <title>Cek Guru Pengampu - Bimbel</title>
  
  <!-- PWA Manifest & Ikon -->
  <link rel="manifest" href='data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Cek%20Guru%20Bimbel%22%2C%22short_name%22%3A%22CekGuru%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23ffffff%22%2C%22theme_color%22%3A%22%231d4ed8%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fapi.iconify.design%2Ffluent-emoji-flat%3Aschool.svg%22%2C%22sizes%22%3A%22192x192%20512x512%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D'>

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background: #eff6ff; color: #111; padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; }
    header { background: #1d4ed8; color: white; padding: 16px; border-radius: 12px 12px 0 0; text-align: center; }
    h1 { font-size: 1.2rem; margin: 0; }
    .card-body { background: white; padding: 16px; border-radius: 0 0 12px 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    
    .section { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #eee; }
    .section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #555; }
    input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; }
    
    .btn { display: block; width: 100%; text-align: center; color: white; text-decoration: none; padding: 12px; border-radius: 8px; font-weight: 700; font-size: 0.95rem; border: none; cursor: pointer; margin-top: 8px; }
    .btn-wa { background: #25D366; }
    .btn-wa:active { background: #1ebe5d; }
    .btn-telp { background: #0284c7; }
    .btn-telp:active { background: #0369a1; }
    .btn-secondary { background: #1d4ed8; color: white; width: 120px; margin-top: 0; }
    
    .result-box { margin-top: 15px; padding: 16px; background: #eff6ff; border-left: 5px solid #1d4ed8; border-radius: 8px; display: none; }
    .student-name { font-size: 1.3rem; font-weight: 700; color: #1e40af; margin-bottom: 4px; }
    .teacher-info { font-size: 1rem; color: #374151; margin-bottom: 12px; font-weight: 600; }
    
    .status-sync { font-size: 0.75rem; color: #1e40af; background: #dbeafe; padding: 4px 8px; border-radius: 4px; display: inline-block; margin-bottom: 10px; }
    
    .log-list { margin-top: 15px; font-size: 0.85rem; color: #666; max-height: 120px; overflow-y: auto; }
    .log-item { padding: 4px 0; border-bottom: 1px dashed #eee; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>👨‍🏫 Cek Guru Pengampu Siswa</h1>
    </header>
    
    <div class="card-body">
      <!-- Status Sinkronisasi GitHub -->
      <div class="section" style="text-align: center;">
        <span id="syncStatus" class="status-sync">⏳ Mengambil data dari GitHub...</span>
      </div>

      <!-- Input Cari Nama Siswa -->
      <div class="section">
        <label>Cari Nama Siswa (Contoh: Xander / Andi)</label>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="inputScan" placeholder="Ketik nama siswa..." onkeypress="cekEnter(event)">
          <button class="btn btn-secondary" onclick="prosesCari()">Cari</button>
        </div>
      </div>

      <!-- Hasil Pencarian Guru & Tombol Aksi -->
      <div id="resultBox" class="result-box">
        <div class="student-name" id="resNama">-</div>
        <div class="teacher-info" id="resInfo">-</div>
        
        <!-- Tombol WhatsApp & Telepon Biasa -->
        <a id="btnWa" href="#" target="_blank" class="btn btn-wa">📲 WhatsApp Guru Pengampu</a>
        <a id="btnTelp" href="#" class="btn btn-telp">📞 Telepon Seluler Guru</a>
      </div>

      <!-- Riwayat Pengecekan Hari Ini -->
      <div class="section" style="margin-top: 20px;">
        <label>Riwayat Pengecekan Hari Ini</label>
        <div id="logContainer" class="log-list">Belum ada pencarian hari ini.</div>
      </div>
    </div>
  </div>

  <script>
    let dbSiswa = [];

    // Tarik otomatis data.csv dari GitHub
    window.onload = function() {
      fetch('data.csv')
        .then(response => {
          if (!response.ok) throw new Error("File data.csv tidak ditemukan di GitHub!");
          return response.text();
        })
        .then(text => {
          parseCSV(text);
          document.getElementById('syncStatus').innerText = `✅ Terhubung ke GitHub (${dbSiswa.length} data siswa dimuat)`;
        })
        .catch(error => {
          console.error(error);
          document.getElementById('syncStatus').style.background = "#fee2e2";
          document.getElementById('syncStatus').style.color = "#dc2626";
          document.getElementById('syncStatus').innerText = "⚠️ Gagal sinkron ke GitHub. Menggunakan data cadangan.";
          
          // Data cadangan sementara
          dbSiswa = [
            { nama: "Jessica .P", guru: "Mr. Mudra", wa: "6281234567890" },
            { nama: "Mahesyah Abdi Utama", guru: "Mr. Mudra", wa: "6289876543210" },
            { nama: "Xander", guru: "Ms. Rahel", wa: "6281398765432" },
            { nama: "Andi Saputra Sidabutar", guru: "Mr. Mudra", wa: "6281122334477" }
          ];
        });
    };

    function parseCSV(text) {
      const rows = text.split('\n');
      let dataBaru = [];

      for (let i = 0; i < rows.length; i++) {
        let row = rows[i].trim();
        if (row) {
          let cols = row.includes(';') ? row.split(';') : row.split(',');
          if (cols.length >= 3) {
            let col1 = cols[0].trim().replace(/['"]+/g, '');
            if (col1.toLowerCase() === 'nama') continue; // Lewati header

            let nama = cols[0].trim().replace(/['"]+/g, '');
            let guru = cols[1].trim().replace(/['"]+/g, '');
            let wa = cols[2].trim().replace(/[^0-9]/g, '');

            if (wa.startsWith('0')) wa = '62' + wa.slice(1);
            if (nama && guru) {
              dataBaru.push({ nama, guru, wa });
            }
          }
        }
      }
      if (dataBaru.length > 0) dbSiswa = dataBaru;
    }

    function cekEnter(e) {
      if (e.key === 'Enter') {
        prosesCari();
      }
    }

    function prosesCari() {
      const keyword = document.getElementById('inputScan').value.trim().toLowerCase();
      if (!keyword) {
        alert("Ketik nama siswa terlebih dahulu!");
        return;
      }

      const siswaDitemukan = dbSiswa.find(s => s.nama.toLowerCase() === keyword || s.nama.toLowerCase().includes(keyword));
      const resBox = document.getElementById('resultBox');
      
      if (siswaDitemukan) {
        document.getElementById('resNama').innerText = "👤 " + siswaDitemukan.nama;
        document.getElementById('resInfo').innerHTML = `Guru Pengampu: <strong style="color: #1d4ed8;">${siswaDitemukan.guru}</strong>`;
        
        // Format link WA
        const teksPesan = `Halo ${siswaDitemukan.guru}, penjemput untuk *${siswaDitemukan.nama}* sudah tiba di depan. Mohon disiapkan ya, terima kasih!`;
        const urlWa = `https://wa.me/${siswaDitemukan.wa}?text=${encodeURIComponent(teksPesan)}`;
        
        // Format link Telepon Biasa (GSM) menggunakan protocol tel:
        // Catatan: Ubah format 62 kembali ke 0 jika perangkat/Chromeboox menggunakan dialer seluler lokal
        let nomorTelp = siswaDitemukan.wa;
        if (nomorTelp.startsWith('62')) {
          nomorTelp = '0' + nomorTelp.slice(2);
        }
        const urlTelp = `tel:${nomorTelp}`;

        document.getElementById('btnWa').setAttribute('href', urlWa);
        document.getElementById('btnTelp').setAttribute('href', urlTelp);
        resBox.style.display = 'block';

        tambahLog(siswaDitemukan.nama, siswaDitemukan.guru);
      } else {
        resBox.style.display = 'none';
        alert(`Siswa dengan nama "${keyword}" tidak ditemukan di database.`);
      }

      document.getElementById('inputScan').value = '';
      document.getElementById('inputScan').focus();
    }

    function tambahLog(namaSiswa, namaGuru) {
      const logContainer = document.getElementById('logContainer');
      const waktu = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
      
      if (logContainer.innerText.includes("Belum ada")) {
        logContainer.innerHTML = "";
      }
      
      const item = document.createElement('div');
      item.className = 'log-item';
      item.innerText = `[${waktu}] Cek ${namaSiswa} ➔ Guru: ${namaGuru}`;
      logContainer.prepend(item);
    }
  </script>
</body>
</html>
